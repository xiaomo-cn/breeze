spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/breeze
    username: breeze
    password: breeze123
  flyway:
    clean-disabled: true
    locations: classpath:db/migration
  ai:
    openai:
      embedding:
        api-key: ${DASHSCOPE_API_KEY:${EMBEDDING_API_KEY:test-key}}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1024
        index-type: hnsw
        distance-type: cosine_distance
        id-type: text
        table-name: vector_store

jwt:
  secret: test-secret-key-for-integration-tests-min-256-bits
