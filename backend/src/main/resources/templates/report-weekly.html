<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>
  body { font-family: 'Source Han Sans SC', 'SimSun', sans-serif; font-size: 12px; }
  h1 { font-size: 18px; text-align: center; }
  h2 { font-size: 14px; margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
  th { background-color: #f5f5f5; }
  .stats { margin: 12px 0; }
  .stats span { margin-right: 24px; }
</style>
</head>
<body>
<h1>周报 — <span th:text="${report.startDate}"></span> ~ <span th:text="${report.endDate}"></span></h1>

<div class="stats">
  <span>新增任务: <strong th:text="${report.newTasks}">0</strong></span>
  <span>完成任务: <strong th:text="${report.completedTasks}">0</strong></span>
  <span>剩余任务: <strong th:text="${report.remainingTasks}">0</strong></span>
</div>

<h2>成员贡献</h2>
<table>
  <tr><th>成员</th><th>完成数</th><th>负责数</th></tr>
  <tr th:each="c : ${report.contributions}">
    <td th:text="${c.userName}"></td>
    <td th:text="${c.completed}"></td>
    <td th:text="${c.created}"></td>
  </tr>
</table>

<h2>任务状态分布</h2>
<table>
  <tr><th>状态</th><th>数量</th></tr>
  <tr th:each="entry : ${report.taskDistribution}">
    <td th:text="${entry.key}"></td>
    <td th:text="${entry.value}"></td>
  </tr>
</table>
</body>
</html>
