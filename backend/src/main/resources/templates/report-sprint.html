<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>
  body { font-family: 'Source Han Sans SC', 'SimSun', sans-serif; font-size: 12px; }
  h1 { font-size: 18px; text-align: center; }
  h2 { font-size: 14px; margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
  th { background-color: #f5f5f5; }
  .stats { margin: 12px 0; }
  .stats span { margin-right: 24px; }
</style>
</head>
<body>
<h1>Sprint 报告 — <span th:text="${report.sprintName}"></span></h1>

<p>目标: <span th:text="${report.sprintGoal}"></span></p>
<p>状态: <span th:text="${report.sprintStatus}"></span></p>

<div class="stats">
  <span>任务完成率: <strong th:text="${#numbers.formatDecimal(report.completionRate * 100, 1, 1)} + '%'">0%</strong></span>
  <span>总任务: <strong th:text="${report.totalTasks}">0</strong></span>
  <span>已完成: <strong th:text="${report.completedTasks}">0</strong></span>
  <span>总故事点: <strong th:text="${report.totalStoryPoints}">0</strong></span>
  <span>已完成故事点: <strong th:text="${report.completedStoryPoints}">0</strong></span>
</div>

<h2>成员贡献</h2>
<table>
  <tr><th>成员</th><th>完成数</th><th>负责数</th></tr>
  <tr th:each="c : ${report.contributions}">
    <td th:text="${c.userName}"></td>
    <td th:text="${c.completed}"></td>
    <td th:text="${c.created}"></td>
  </tr>
</table>
</body>
</html>
