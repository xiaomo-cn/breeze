version: "3.8"

# ==========================================
# Breeze 项目管理系统 Docker 部署
# ==========================================
# 使用内置数据库（推荐新用户）：
#   docker compose --profile infra up -d
#
# 使用外部数据库（已有 PostgreSQL/Redis）：
#   1. 编辑 .env，设置 DB_HOST / REDIS_HOST 为外部地址
#   2. docker compose up -d
# ==========================================

services:
  # ========== 基础设施（可选，通过 --profile infra 启用）==========
  postgres:
    image: pgvector/pgvector:pg16
    container_name: breeze-postgres
    profiles: ["infra"]
    environment:
      POSTGRES_DB: ${DB_NAME:-breeze}
      POSTGRES_USER: ${DB_USER:-breeze}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-breeze123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-breeze}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: breeze-redis
    profiles: ["infra"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-breeze123}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-breeze123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: breeze-minio
    profiles: ["infra"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # ========== 后端 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: breeze-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-breeze}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-breeze}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-breeze123}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-breeze123}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-256-bits}
      SERVER_PORT: "8080"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-breeze}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      minio:
        condition: service_started
        required: false
    restart: unless-stopped

  # ========== 前端 ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: breeze-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
